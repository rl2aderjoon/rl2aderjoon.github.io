<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장효준 · 포트폴리오</title>
  <style>
    @font-face {
      font-family: Pretendard;
      src: url("./assets/fonts/PretendardVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    :root { font-family: Pretendard, sans-serif; color: #211b34; background: #ddd5fa; }
    body { margin: 0; }
    main {
      --inset-block: clamp(23px, 5vh, 56px);
      --inset-inline: clamp(20px, 7vw, 108px);
      --surface: #ddd5fa;
      --ink: #211b34;
      --muted: #55476c;
      position: relative; isolation: isolate; display: grid;
      min-height: 100svh;
      padding: var(--inset-block) var(--inset-inline);
      background: var(--surface); color: var(--ink);
      transition: background-color 520ms ease, color 320ms ease;
    }
    main[data-project="gabolle"] { --surface: #cee9d9; --ink: #152e29; --muted: #365b50; }
    main[data-project="robotable"] { --surface: #f6d0bf; --ink: #3a232a; --muted: #69424a; }
    .home-name {
      position: absolute; z-index: 1;
      inset-block-start: var(--inset-block); inset-inline-start: var(--inset-inline);
      min-height: 44px; padding: 0; border: 0; background: none;
      color: inherit; cursor: pointer; text-align: left;
      font: 700 clamp(14px, 1.5vw, 18px)/1.2 Pretendard, sans-serif;
    }
    .reading-toggle {
      position: absolute; z-index: 2; inset-inline-start: 50%;
      inset-block-end: max(var(--inset-block), env(safe-area-inset-bottom));
      display: grid; place-items: center; width: 44px; height: 44px;
      padding: 0; border: 0; border-radius: 8px; background: transparent;
      transform: translateX(-50%); color: var(--ink); cursor: pointer;
    }
    .footer-chevrons {
      width: 20px; height: 22px;
      animation: chevron-bob 2.6s ease-in-out infinite;
    }
    .reading-toggle[aria-expanded="true"] .footer-chevrons { animation: none; transform: rotate(180deg); }
    @keyframes chevron-bob {
      0%, 100% { transform: translateY(2px); }
      50% { transform: translateY(-3px); }
    }
    nav {
      position: relative; z-index: 1; display: grid; width: fit-content;
      align-self: center; justify-items: start;
      row-gap: clamp(16px, 2vw, 24px);
    }
    .project {
      display: block; min-height: 44px; padding: 3px 0; border: 0;
      background: none; color: var(--muted); text-align: left;
      font: 500 clamp(18px, 2.1vw, 28px)/1.2 Pretendard, sans-serif;
      letter-spacing: -.02em; cursor: pointer;
      text-shadow: 0 0 8px var(--surface), 0 0 3px var(--surface);
    }
    .project:hover, .project[aria-pressed="true"] { color: var(--ink); }
    .project[aria-pressed="true"] { font-weight: 650; }
    .open-project {
      position: absolute; z-index: 0; inset: 0 auto auto 0; padding: 0; border: 0;
      border-radius: 12px; color: inherit; background: transparent; cursor: zoom-in;
    }
    .home-name:focus-visible, .project:focus-visible, .open-project:focus-visible,
    .close-detail:focus-visible, .reading-toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    .stage { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; }
    .stage canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    .stage .fallback {
      position: relative; inset: auto; width: min(72vw, 710px); height: auto;
      max-height: 72vh; object-fit: contain; margin-left: 12vw;
    }
    .stage [hidden] { display: none; }
    main[data-reading] nav {
      position: absolute; inset-block-start: var(--inset-block); inset-inline-end: var(--inset-inline);
      display: flex; gap: clamp(10px, 2.3vw, 24px);
    }
    main[data-reading] nav .project { font-size: clamp(13px, 1.8vw, 18px); }
    main[data-reading] .stage .fallback { visibility: hidden; }
    main[data-reading] .stage[data-fallback]::before {
      content: ""; position: absolute;
      inset: max(100px, 13svh) max(19px, calc((100% - 715px) / 2)) max(85px, 12svh);
      border-inline: 3px dotted var(--muted);
    }
    .inline-reading {
      position: absolute; z-index: 1; inset-inline-start: 50%;
      inset-block: max(83px, 12svh) max(76px, 11svh);
      width: min(660px, calc(100% - 80px));
      padding: clamp(14px, 4vh, 36px) clamp(10px, 2vw, 24px);
      transform: translateX(-50%); overflow-y: auto; overscroll-behavior: contain;
      scrollbar-width: thin; scrollbar-color: var(--muted) transparent;
    }
    .inline-reading:not([hidden]) { animation: reading-in 380ms 175ms ease-out both; }
    @keyframes reading-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .inline-reading:focus { outline: none; }
    .inline-reading h1 {
      margin: 0 0 7px; font-size: clamp(32px, 5.2vw, 54px);
      font-weight: 690; letter-spacing: -.035em; line-height: 1.12;
    }
    .inline-reading .reading-subtitle { color: var(--muted); margin: 0 0 20px; }
    .inline-reading p, .inline-reading li {
      font-size: clamp(16px, 2vw, 18px); line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere;
    }
    .inline-reading .detail-image {
      width: min(100%, 390px); max-height: none; margin-top: 20px; border-radius: 10px;
    }
    .project-detail {
      width: min(720px, calc(100% - 32px)); max-height: calc(100dvh - 32px);
      padding: 0; border: 0; border-radius: 18px;
      color: #25212a; background: #fbf9f6;
      overscroll-behavior: contain;
    }
    .project-detail::backdrop { background: #19141c9e; }
    .detail-header {
      position: sticky; top: 0; display: flex; justify-content: space-between;
      align-items: flex-start; gap: 12px; padding: clamp(20px, 4vw, 32px);
      background: #fbf9f6;
    }
    .detail-header h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); letter-spacing: -.035em; }
    .detail-header p { margin: 5px 0 0; color: #59535e; font-size: 15px; }
    .close-detail {
      width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%;
      background: transparent; color: inherit; cursor: pointer;
      font: 400 26px/1 Pretendard, sans-serif;
    }
    .close-detail:hover { background: #eae5e8; }
    .detail-content { padding: 0 clamp(20px, 4vw, 32px) clamp(20px, 4vw, 32px); }
    .detail-content p { margin: 0 0 20px; font-size: 16px; line-height: 1.5; word-break: keep-all; }
    .detail-image { display: block; width: 100%; max-height: 55dvh; object-fit: contain; background: #eee9e9; }
    .detail-image[hidden] { display: none; }
    .detail-steps { margin: 0; padding: 0 0 0 1.3em; }
    .detail-steps li + li { margin-top: 9px; }
    @media (max-width: 600px) {
      .stage .fallback { width: 86vw; }
    }
    @media (prefers-reduced-motion: reduce) {
      main { transition: none; }
      .footer-chevrons { animation: none; }
      .inline-reading:not([hidden]) { animation: none; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./assets/vendor/three/three.module.min.js" } }
  </script>
</head>
<body>
  <main data-project="bbiyong">
    <button class="home-name" type="button">Jang HyoJoon</button>
    <div class="stage" role="img" aria-label="입자로 그린 삐용 차체">
      <canvas class="fallback" width="620" height="440" aria-hidden="true" hidden></canvas>
    </div>
    <button class="open-project" type="button" aria-haspopup="dialog" aria-controls="project-detail" hidden></button>
    <nav aria-label="프로젝트">
      <button class="project" type="button" data-project="bbiyong" aria-pressed="true">삐용</button>
      <button class="project" type="button" data-project="gabolle" aria-pressed="false">가볼래</button>
      <button class="project" type="button" data-project="robotable" aria-pressed="false">로보터블</button>
    </nav>
    <article class="inline-reading" id="inline-reading" aria-labelledby="reading-title" tabindex="-1" hidden>
      <h1 id="reading-title" data-project-title></h1>
      <p class="reading-subtitle" data-project-subtitle></p>
      <p data-project-description></p>
      <img class="detail-image" alt="" hidden>
      <ol class="detail-steps" hidden></ol>
    </article>
    <button class="reading-toggle" type="button" aria-label="프로젝트 글 열기"
            aria-expanded="false" aria-controls="inline-reading">
      <svg class="footer-chevrons" viewBox="0 0 24 26" fill="none" stroke="currentColor"
           stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m5 9 7-5 7 5m-14 6 7-5 7 5m-14 6 7-5 7 5"/>
      </svg>
    </button>
  </main>
  <dialog class="project-detail" id="project-detail" aria-labelledby="detail-title" aria-describedby="detail-description">
    <header class="detail-header">
      <div>
        <h1 id="detail-title" data-project-title></h1>
        <p data-project-subtitle></p>
      </div>
      <form method="dialog">
        <button class="close-detail" type="submit" aria-label="상세 닫기" autofocus>×</button>
      </form>
    </header>
    <div class="detail-content">
      <p id="detail-description" data-project-description></p>
      <img class="detail-image" alt="" hidden>
      <ol class="detail-steps" hidden></ol>
    </div>
  </dialog>
  <script type="module" src="./home.js?v=reading"></script>
</body>
</html>
