<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장효준</title>
<meta name="description" content="장효준(rl2aderjoon)의 개발 기록, 포트폴리오, 사진, 독후감.">
<meta name="theme-color" content="#f2f2f0">
<style>
@font-face{font-family:"Pretendard Variable";src:url(assets/fonts/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-display:swap}
/* 흑백 팔레트: 2026 포트폴리오 페이지와 같은 회색 단계. 네 갈래도 색 대신 회색의 진하기로 나눈다 */
:root{
  --paper:#f2f2f0; --ink:#121212; --ink-2:#3a3a38; --mute:#7c7c78; --line:#d6d6d2; --soft:#e8e8e6; --card:#fff;
  --dev:#121212; --work:#4a4a48; --photo:#7c7c78; --book:#a3a3a0;
  --side:264px; --ease:cubic-bezier(.2,.7,.1,1);
}
body.night{--paper:#111; --ink:#f1f1ee; --ink-2:#cfcfcb; --mute:#8a8a86; --line:#2e2e2e; --soft:#181818; --card:#1b1b1b;
  --dev:#f1f1ee; --work:#cfcfcb; --photo:#8a8a86; --book:#5c5c59}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;letter-spacing:-.01em;word-break:keep-all;overflow:hidden;transition:background-color .5s,color .5s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
img{display:block;max-width:100%}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ---------- 틀: 사이드바는 처음엔 없다 ---------- */
.app{display:grid;grid-template-columns:0 1fr;height:100%;transition:grid-template-columns .8s var(--ease)}
body.open .app{grid-template-columns:var(--side) 1fr}
.side{overflow:hidden;border-right:1px solid transparent;background:var(--soft);transition:border-color .8s;display:flex;flex-direction:column;min-width:0}
body.open .side{border-right-color:var(--line)}
.side-in{width:var(--side);padding:18px 12px;display:flex;flex-direction:column;gap:4px;height:100%}
.who{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.dots{display:grid;grid-template-columns:repeat(2,7px);gap:3px}
.dots i{width:7px;height:7px;border-radius:50%}
.dots i:nth-child(1){background:var(--dev)}.dots i:nth-child(2){background:var(--work)}.dots i:nth-child(3){background:var(--photo)}.dots i:nth-child(4){background:var(--book)}
.who b{font-weight:700;font-size:15px}
.new{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-weight:600}
.new:hover{background:var(--line)}
.label{font-size:12px;color:var(--mute);padding:18px 10px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;opacity:0;transform:translateX(-12px);transition:opacity .4s,transform .5s var(--ease),background-color .2s}
.nav button:hover{background:var(--line)}
.nav button[aria-current]{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.nav .sw{width:8px;height:8px;border-radius:50%;flex:none}
.nav small{margin-left:auto;color:var(--mute);font-size:12px}
.side-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:10px;font-size:13px;color:var(--mute)}

/* ---------- 본문 ---------- */
.main{position:relative;display:flex;flex-direction:column;min-width:0;height:100%}
.top{position:absolute;inset:0 0 auto 0;display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;z-index:5}
.chip{font-size:12px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);background:var(--paper)}
.chip:hover{border-color:var(--ink-2)}
.thread{flex:1;overflow-y:auto;scroll-behavior:smooth;padding:72px 24px 24px}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

/* 시작 화면: AI 서비스 첫 화면처럼 표식 + 시간 인사 + 가운데 입력창 */
.hello{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px 24px 12vh;transition:opacity .45s,transform .6s var(--ease)}
body.started .hello{opacity:0;transform:translateY(-24px);pointer-events:none}
.hello h1{display:flex;align-items:center;gap:16px;font-size:clamp(28px,3.4vw,40px);line-height:1.2;letter-spacing:-.03em;font-weight:440;text-align:center}
.mark{display:grid;grid-template-columns:repeat(2,1fr);gap:.12em;width:.72em;height:.72em;flex:none}
.mark i{border-radius:50%;background:var(--ink);animation:mk 2.4s var(--ease) infinite}
.mark i:nth-child(2){animation-delay:.15s}.mark i:nth-child(3){animation-delay:.45s}.mark i:nth-child(4){animation-delay:.3s}
@keyframes mk{0%,70%,100%{transform:none}35%{transform:scale(.55)}}
.hello .composer{padding-bottom:12px}
.hello .composer textarea{min-height:52px}
.tool{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
.crow-r{display:flex;align-items:center;gap:12px}
.model{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.model b{font-weight:600;color:var(--ink)}
.model small{font-size:13px;color:var(--mute)}
.fine{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12px;color:var(--mute)}

.composer{width:min(680px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 10px 20px;box-shadow:0 1px 0 var(--line),0 18px 40px -24px rgba(0,0,0,.25);transition:box-shadow .3s}
.composer:focus-within{box-shadow:0 0 0 1px var(--ink-2),0 18px 40px -24px rgba(0,0,0,.3)}
.composer textarea{width:100%;border:0;outline:0;resize:none;background:none;font:inherit;font-size:16px;color:var(--ink);min-height:28px;height:28px}
.composer textarea::placeholder{color:var(--mute)}
.crow{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.hint{font-size:12px;color:var(--mute)}
.send{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;transition:transform .15s,background-color .3s}
.send.press{transform:scale(.84);background:var(--mute)}
.dock{padding:0 24px 22px;display:flex;justify-content:center;opacity:0;transform:translateY(16px);transition:opacity .5s .3s,transform .6s .3s var(--ease)}
body.started .dock{opacity:1;transform:none}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--ink);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 대화 메시지 */
.msg-u{align-self:flex-end;max-width:80%;background:var(--soft);border:1px solid var(--line);padding:10px 16px;border-radius:18px 18px 4px 18px;animation:rise .45s var(--ease)}
.msg-a{animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.think{display:flex;gap:5px;padding:6px 0}
.think i{width:7px;height:7px;border-radius:50%;animation:bob 1s infinite}
.think i:nth-child(1){background:var(--dev)}.think i:nth-child(2){background:var(--work);animation-delay:.12s}.think i:nth-child(3){background:var(--photo);animation-delay:.24s}.think i:nth-child(4){background:var(--book);animation-delay:.36s}
@keyframes bob{50%{transform:translateY(-6px)}}
.reveal>*{opacity:0;transform:translateY(8px);transition:opacity .5s,transform .6s var(--ease)}
.reveal>.on{opacity:1;transform:none}

/* 첫 답: 소개 + 네 갈래 */
.intro h2{font-size:clamp(28px,4vw,44px);line-height:1.2;letter-spacing:-.03em;font-weight:760}
.intro p{color:var(--ink-2);font-size:17px;margin-top:14px;max-width:34em}
.four{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:26px}
.four button{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;min-height:132px;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s var(--ease),border-color .2s}
.four button::before{content:"";position:absolute;inset:auto -30px -50px auto;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.16;transition:transform .5s var(--ease),opacity .3s}
.four button:hover{transform:translateY(-3px);border-color:var(--c)}
.four button:hover::before{transform:scale(1.5);opacity:.26}
.four .n{font-size:12px;color:var(--mute)}
.four b{font-size:20px;letter-spacing:-.02em;margin-top:auto}
.four span{font-size:13px;color:var(--ink-2)}
.four .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* ---------- 네 갈래가 함께 쓰는 답 틀: 머리 → 대표 하나 → 목록 ---------- */
.ans-h{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ans-h .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
.ans-h h2{font-size:22px;letter-spacing:-.03em;font-weight:740}
.ans-h p{color:var(--mute);font-size:13px}
.ans-h .all{margin-left:auto;font-size:13px;color:var(--ink-2)}
.ans-h .all:hover{color:var(--ink)}

.lead{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:center;padding:20px 0;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.media{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,var(--paper));display:grid;place-items:center}
.media img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.lead:hover .media img{transform:scale(1.04)}
.media .cover{width:auto;height:78%;object-fit:contain;border-radius:4px;box-shadow:0 16px 30px -14px rgba(0,0,0,.55)}
.media pre{margin:0;padding:22px;width:100%;font:13px/1.7 ui-monospace,Consolas,"Pretendard Variable",monospace;color:var(--ink-2);white-space:pre-wrap}
.media pre b{color:var(--ink);font-weight:600}
.kick{font-size:12px;color:var(--mute);display:flex;gap:8px}
.kick i{font-style:normal;color:var(--c);font-weight:600;filter:brightness(.8)}
.lead h3{font-size:24px;line-height:1.3;letter-spacing:-.025em;font-weight:720;margin-top:8px}
.lead p{font-size:15px;color:var(--ink-2);margin-top:10px}
.lead .more{display:inline-block;margin-top:16px;font-size:13px;font-weight:600;border-bottom:2px solid var(--c)}

.rows li{border-bottom:1px solid var(--line)}
.rows a{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;padding:12px 0;text-decoration:none;color:inherit}
.thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,var(--paper));display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .cover{width:auto;height:86%;object-fit:contain;border-radius:2px}
.rows h4{font-size:16px;font-weight:640;margin:0}
.rows p{font-size:13px;color:var(--mute)}
.rows a:hover h4{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:2px;text-underline-offset:4px}
.rows time{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}

/* ---------- 상세: 오른쪽으로 펼쳐지는 문서. 네 갈래가 같은 뼈대를 쓴다 ---------- */
.app{grid-template-columns:0 1fr 0;grid-template-rows:minmax(0,100%)}
body.open .app{grid-template-columns:var(--side) 1fr 0}
body.open.reading .app{grid-template-columns:var(--side) minmax(340px,.8fr) 1.25fr}
.doc{position:relative;min-width:0;overflow:hidden;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
.doc-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
.doc-bar .sw{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.doc-bar .crumb{color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.doc-bar .crumb b{color:var(--ink);font-weight:600}
.doc-bar .gap{margin-left:auto}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.ib:hover{background:var(--soft)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.doc-body{flex:1;overflow-y:auto;padding:40px clamp(20px,5vw,64px) 80px}
.doc-in{max-width:680px;margin:0 auto}
.doc-in>*{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .6s var(--ease)}
.doc-in>.on{opacity:1;transform:none}
.doc h1{font-size:clamp(28px,3.4vw,40px);line-height:1.2;letter-spacing:-.035em;font-weight:760;margin-top:10px}
.doc .dek{font-size:17px;color:var(--ink-2);margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:26px 0}
.facts div{background:var(--card);padding:12px 14px}
.facts dt{font-size:12px;color:var(--mute)}
.facts dd{margin:2px 0 0;font-size:14px;font-weight:600}
.hero{position:relative;border-radius:16px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,var(--paper));aspect-ratio:16/10;display:grid;place-items:center;margin-bottom:30px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .cover{width:auto;height:84%;object-fit:contain;border-radius:4px;box-shadow:0 20px 40px -18px rgba(0,0,0,.6)}
.hero pre{margin:0;padding:28px;width:100%;font:14px/1.75 ui-monospace,Consolas,"Pretendard Variable",monospace;color:var(--ink-2);white-space:pre-wrap}
.hero pre b{color:var(--ink);font-weight:600}
.hero .nav-ph{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(242,242,240,.9);color:#121212;font-size:22px;display:grid;place-items:center}
.hero .nav-ph:disabled{opacity:.3}
.hero .prev{left:12px}.hero .next{right:12px}
.hero .count{position:absolute;right:12px;bottom:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.55);padding:2px 9px;border-radius:99px}
.prose{font-size:16.5px;line-height:1.85;color:var(--ink-2)}
.prose h2{font-size:20px;letter-spacing:-.02em;color:var(--ink);margin:36px 0 10px;display:flex;align-items:center;gap:10px}
.prose h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--c)}
.prose p+p{margin-top:14px}
.prose blockquote{margin:20px 0;padding:4px 0 4px 18px;border-left:3px solid var(--c);color:var(--ink)}
.prose code{font:.9em ui-monospace,Consolas,monospace;background:var(--soft);padding:1px 5px;border-radius:4px}
.prose .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.prose .tags span{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink-2)}
.prose .ph{font-size:13px;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.next-h{font-size:13px;color:var(--mute);margin:48px 0 4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
/* 대화 안에 남는 문서 카드 */
.doccard{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;max-width:420px;margin-top:10px}
.doccard:hover{border-color:var(--c)}
.doccard .thumb{flex:none}
.doccard b{display:block;font-size:14px}
.doccard small{font-size:12px;color:var(--mute)}
@media (max-width:1100px){
  body.open.reading .app{grid-template-columns:var(--side) 1fr 0}
  .doc{position:fixed;inset:0 0 0 auto;width:min(760px,100%);z-index:30;box-shadow:-30px 0 60px -30px rgba(0,0,0,.35);transform:translateX(100%);visibility:hidden;transition:transform .6s var(--ease),visibility 0s .6s}
  body.reading .doc{transform:none;visibility:visible;transition:transform .6s var(--ease)}
}
@media (max-width:760px){
  body.open.reading .app{grid-template-columns:0 1fr 0}
  .facts{grid-template-columns:1fr 1fr}
  .doc-body{padding:28px 18px 60px}
}
.follow{display:flex;flex-wrap:wrap;gap:8px}
.follow button{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.follow button:hover{border-color:var(--ink-2)}

@media (max-width:760px){
  body.open .app{grid-template-columns:0 1fr 0}
  body.open.drawer .app{grid-template-columns:var(--side) 1fr 0}
  .menu{display:inline-flex!important}
  .four{grid-template-columns:1fr}
  .lead{grid-template-columns:1fr;gap:14px}
  .rows a{grid-template-columns:48px 1fr}
  .rows time{display:none}
}
.menu{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- 읽기 화면: 머리 → 가는 선 → 왼쪽 목차 + 좁은 본문 ---------- */
:root{--mono:ui-monospace,"Cascadia Mono",Consolas,"Pretendard Variable",monospace}
body.open.reading .app{grid-template-columns:var(--side) minmax(320px,.6fr) 1.4fr}
body.open.reading.wide .app{grid-template-columns:var(--side) 0 1fr}
body.wide .main{visibility:hidden}
body:not(.reading) .doc{border-left-color:transparent}
.doc{container-type:inline-size}
/* 상세가 열려 대화 칸이 좁아지면 대표 항목을 한 줄로 쌓는다 */
.thread{container-type:inline-size}
@container (max-width:560px){.lead{grid-template-columns:1fr;gap:14px}.lead .media{aspect-ratio:16/9}.thread .intro h2{font-size:24px}.thread .four{grid-template-columns:1fr}}
.doc-body{padding:0 0 80px}
.doc-in{max-width:none;margin:0}
.rd{display:grid;grid-template-columns:200px minmax(0,560px);column-gap:48px;justify-content:center;padding:0 32px}
.rd-head{padding:44px 0 36px}
.tile{width:52px;height:52px;border-radius:10px;background:var(--ink);display:grid;place-items:center;font:700 18px var(--mono);color:var(--card);margin-bottom:22px}
.doc h1{font-size:clamp(26px,3vw,34px);line-height:1.25;letter-spacing:-.03em;margin:0}
.doc .dek{font-size:16px;line-height:1.75;color:var(--ink-2);margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:16px 40px;margin:26px 0 0}
.meta dt,.ml{font:600 11px var(--mono);letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.meta dd{margin:6px 0 0;font-size:14px;font-weight:600;display:flex;gap:6px;max-width:16em}
.meta dd::before,.toc a::before,.share a::before{content:"└";color:var(--mute);font:400 12px var(--mono)}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.rail{position:sticky;top:0;align-self:start;height:calc(100vh - 55px);padding:36px 0 28px;display:flex;flex-direction:column}
.rail-t{font-size:14px;font-weight:700;line-height:1.4;margin-bottom:16px;opacity:0;transition:opacity .3s}
.rail.past .rail-t{opacity:1}
.toc{margin:10px 0 18px}
.toc a{display:flex;gap:7px;font:12.5px/1.5 var(--mono);color:var(--mute);text-decoration:none;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--ink);font-weight:700}
.prog{display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--mute)}
.prog .bar{flex:1;height:9px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 4px);position:relative}
.prog .bar i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px)}
.rail .ml{margin-top:10px}
.share{margin-top:auto}
.share a{display:flex;gap:7px;font:12.5px/1.8 var(--mono);color:var(--mute);text-decoration:none}
.share a:hover{color:var(--ink)}
.rd-body{padding-top:36px}
.prose{font-size:16px;line-height:1.8;color:var(--ink-2)}
.prose>p,.prose>ul,.prose>ol{margin:0 0 14px}
.prose p+p{margin-top:0}
.prose h2{display:block;font:700 14px/1.5 var(--mono);letter-spacing:.06em;color:var(--ink);margin:44px 0 14px;scroll-margin-top:24px}
.prose h2::before{content:attr(data-n) "  ";width:auto;height:auto;background:none;color:var(--c);filter:brightness(.85);white-space:pre}
.prose ol,.prose ul{padding-left:1.3em}
.prose ol{list-style:decimal}.prose ul{list-style:disc}
.prose li{margin:4px 0}
.prose a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--mute);text-underline-offset:3px}
.prose em{font-style:italic;color:var(--ink)}
.prose strong{color:var(--ink)}
.prose blockquote{margin:24px 0;padding:2px 0 2px 18px;border-left:2px solid var(--c);font-size:17px;color:var(--ink)}
/* 그림: 테두리 상자 + 아래 FIG 띠 */
.fig{margin:28px 0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--paper)}
.fig-in{position:relative;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,var(--paper));aspect-ratio:16/10}
.fig-in img{width:100%;height:100%;object-fit:cover}
.fig-in .cover{width:auto;height:84%;object-fit:contain;border-radius:3px;box-shadow:0 18px 36px -18px rgba(0,0,0,.6)}
.fig-in pre{margin:0;padding:24px;width:100%;font:13.5px/1.75 var(--mono);color:var(--ink-2);white-space:pre-wrap}
.fig-in pre b{color:var(--ink)}
.fig-in.flow{aspect-ratio:auto;display:block;place-items:normal;padding:18px 20px;background:var(--card)}
.fig figcaption{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.fig figcaption b{font:700 11px/1.9 var(--mono);letter-spacing:.08em;color:var(--mute)}
.flow h5{font-size:15px;margin:0}
.flow small{display:block;font-size:12px;color:var(--mute);margin-bottom:10px}
.flow .st{font:600 10.5px var(--mono);letter-spacing:.08em;color:var(--mute);margin:14px 0 6px 26px}
.flow .r{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1.2fr);gap:8px;font-size:13px;padding:3px 0;align-items:baseline}
.flow .r b{font-weight:600;color:var(--ink)}
.flow .r span{color:var(--mute);font-size:12px}
.flow .r i{font-style:normal;color:var(--mute);font:12px var(--mono)}
.flow .r i.hot{color:var(--c);filter:brightness(.85)}
.rd-foot{padding-top:8px}
.rd-foot .next-h{margin-top:56px}
.wide-btn{font:600 11px var(--mono);letter-spacing:.06em;color:var(--mute);padding:6px 8px;border-radius:6px}
.wide-btn:hover{background:var(--soft);color:var(--ink)}
/* 패널이 좁으면 목차 칸을 접고, 진행 막대만 위에 붙인다 */
@container (max-width:820px){
  .rd{grid-template-columns:minmax(0,600px);padding:0 24px}
  .rail{position:sticky;top:0;height:auto;padding:10px 0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);grid-row:3}
  .rail-t,.toc,.share,.rail .ml,.rd-head-pad{display:none}
  .rd-body{grid-row:4}
}

/* ---------- 첫 화면과 소개 ---------- */
.nav button.in{opacity:1;transform:none}
.sugg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:-10px;opacity:0;animation:fadein .6s .5s forwards}
@keyframes fadein{to{opacity:1}}
.sugg button{display:flex;align-items:center;gap:7px;font-size:13px;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);transition:border-color .2s,transform .2s var(--ease)}
.sugg button:hover{border-color:var(--c);transform:translateY(-1px);color:var(--ink)}
.sugg i{width:7px;height:7px;border-radius:50%;background:var(--c)}
/* 기록을 찾는 단계: 줄이 하나 생길 때마다 사이드바에도 한 줄 */
.steps{font:12.5px/1.7 var(--mono);color:var(--mute);margin-bottom:22px}
.steps .st-h{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.steps .spin{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steps ul{margin:4px 0 0 4px}
.steps li{display:flex;align-items:center;gap:8px;animation:rise .35s var(--ease)}
.steps li::before{content:"└";color:var(--line)}
.steps li i{width:6px;height:6px;border-radius:50%}
.steps li small{margin-left:auto;max-width:9em;color:var(--mute)}
.steps.done ul{display:none}
.steps.done .st-h::before{content:"✓";color:var(--ink)}
/* 소개 */
.intro .hi{font-size:15px;color:var(--mute);margin-bottom:10px}
.intro h2{font-size:clamp(28px,3.6vw,42px);line-height:1.25}
.intro p.lede{color:var(--ink-2);font-size:16.5px;line-height:1.75;margin-top:16px;max-width:36em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:26px 0 0}
.stats div{background:var(--card);padding:14px 16px}
.stats dt{font-size:24px;font-weight:780;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums}
.stats dd{margin:4px 0 0;font-size:12px;color:var(--mute);line-height:1.45}
.four em{font-style:normal;font-size:12px;color:var(--mute);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:block;position:relative}
.four em b{font-size:12.5px;color:var(--ink-2);font-weight:600;display:block;margin:0;letter-spacing:0}
.four button{min-height:168px}
.links{display:flex;gap:16px;margin-top:20px;font:12.5px var(--mono);color:var(--mute)}
.links a{color:inherit;text-decoration:none}
.links a:hover{color:var(--ink)}
.links a::before{content:"↗ "}
.cursor::after{content:"";display:inline-block;width:.5em;height:1em;background:var(--ink);vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(1) infinite}
@container (max-width:560px){.stats{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}

/* ---------- 포트폴리오 시각 효과: 모두 FIG 상자 안에서, 화면에 들어올 때 움직인다 ---------- */
.fig-in video{width:100%;height:100%;object-fit:cover;display:block}
.fig-in.free{aspect-ratio:auto;display:block;place-items:normal;background:var(--card)}
/* 숫자 띠 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;margin:28px 0;overflow:hidden}
.kpis div{background:var(--card);padding:14px 16px}
.kpis b{display:block;font-size:26px;font-weight:780;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.kpis span{display:block;font-size:12.5px;line-height:1.5;color:var(--mute);margin-top:4px}
/* 화면 넘겨보기 */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px;height:380px;scrollbar-width:none;cursor:grab}
.strip::-webkit-scrollbar{display:none}
.strip figure{margin:0;flex:none;height:100%;scroll-snap-align:center;display:flex;flex-direction:column;gap:6px}
.strip img{height:calc(100% - 22px);width:auto;max-width:none;border-radius:8px;box-shadow:0 10px 24px -16px rgba(0,0,0,.5);transform:scale(.94);opacity:.55;transition:transform .5s var(--ease),opacity .4s}
.strip figure.cur img{transform:none;opacity:1}
.strip figure span{font-size:12px;color:var(--mute);text-align:center}
.strip-nav{position:absolute;right:12px;top:12px;display:flex;gap:6px;align-items:center;font:12px var(--mono);color:var(--mute)}
.strip-nav button{width:28px;height:28px;border-radius:50%;background:var(--paper);border:1px solid var(--line);color:var(--ink)}
/* 영상 두 개 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.duo figure{margin:0;position:relative;aspect-ratio:4/3;background:#121212}
.duo figure img,.duo figure video{width:100%;height:100%;object-fit:cover}
.duo figure span{position:absolute;left:10px;bottom:8px;font-size:12px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
/* 막대 */
.bars{padding:20px 20px 16px}
.bars h5{font-size:15px;margin:0}
.bars small{display:block;font-size:12px;color:var(--mute);margin-bottom:14px}
.bars li{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-size:13px;padding:5px 0;list-style:none}
.bars ul{padding:0;margin:0}
.bars .tr{height:12px;background:var(--soft);border-radius:2px;overflow:hidden}
.bars .tr i{display:block;height:100%;width:0;background:var(--c);transition:width 1.1s var(--ease)}
.bars li.base .tr i{background:var(--mute)}
.bars em{font:12px var(--mono);font-style:normal;text-align:right;color:var(--ink-2)}
.fx.in .bars .tr i{width:var(--w)}
.bars li:nth-child(2) .tr i{transition-delay:.08s}.bars li:nth-child(3) .tr i{transition-delay:.16s}.bars li:nth-child(4) .tr i{transition-delay:.24s}.bars li:nth-child(5) .tr i{transition-delay:.4s}
/* axMap 그림 */
.axd{--dev:#f1f1ee;--work:#cfcfcb;--book:#a3a3a0;padding:18px;background:#121212;color:#f2f2f0;font:12.5px/1.6 var(--mono)}
.axd .ag{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.axd .ag div{border:1px solid #2e2e2e;border-radius:6px;padding:8px 10px;transition:border-color .3s,background-color .3s}
.axd .ag div.hot{border-color:var(--k);background:color-mix(in srgb,var(--k) 18%,#121212)}
.axd .ag b{display:block;color:var(--k);font-weight:700}
.axd .ag span{color:#8b8b87;font-size:11.5px}
.axd .core{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:10px}
.axd .core>div{border:1px solid #2e2e2e;border-radius:6px;padding:8px 10px;min-height:128px}
.axd .h{font-size:10.5px;letter-spacing:.08em;color:#8b8b87;margin:0 0 6px}
.axd ul{margin:0;padding:0;list-style:none}
.axd li{display:flex;gap:8px;animation:rise .35s var(--ease)}
.axd li i{font-style:normal;color:var(--k)}
.axd li.no{color:#8b8b87}
.axd li.gone{opacity:.35;text-decoration:line-through}
.axd .q{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.axd .q span{padding:1px 7px;border-radius:99px;background:#2e2e2e;color:var(--k);animation:rise .3s var(--ease)}
.axd .turn{margin-top:8px;color:#8b8b87}
.axd .turn b{color:#f2f2f0}
.axd .log{margin-top:10px;color:#cfcfcb;min-height:1.6em}
/* 데스크톱과 모바일 화면 겹치기: 스크롤에 따라 살짝 어긋난다 */
.pair{position:relative;padding:22px 22px 30px;background:color-mix(in srgb,var(--c) 12%,var(--paper));aspect-ratio:16/11}
.pair .dk{width:84%;border-radius:8px;box-shadow:0 20px 40px -22px rgba(0,0,0,.55)}
.pair .mb{position:absolute;right:20px;bottom:18px;width:24%;border-radius:12px;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);transform:translateY(var(--py,0px));transition:transform .1s linear}
.fx{opacity:.001;transform:translateY(14px);transition:opacity .6s,transform .7s var(--ease)}
.fx.in{opacity:1;transform:none}
@container (max-width:520px){.kpis{grid-template-columns:1fr}.duo{grid-template-columns:1fr}.axd .ag,.axd .core{grid-template-columns:1fr}.bars li{grid-template-columns:90px 1fr 46px}}

/* ---------- 사진 벽: 날짜순, 달마다 한 덩어리. 각 사진의 비율을 지키며 줄을 꽉 채운다 ---------- */
.is-wall .rd{grid-template-columns:200px minmax(0,920px)}
.wall{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.wi{position:relative;flex:none;border-radius:3px;overflow:hidden;background:color-mix(in srgb,var(--c) 10%,var(--paper));opacity:0;transform:translateY(8px);transition:opacity .5s,transform .6s var(--ease)}
.wall.in .wi{opacity:1;transform:none}
.wi img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
button.wi{padding:0;cursor:zoom-in}
button.wi:hover img{transform:scale(1.04)}
.wi .cap{position:absolute;inset:auto 0 0 0;padding:16px 8px 6px;font:11px var(--mono);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .25s;text-align:left}
button.wi:hover .cap,button.wi:focus-visible .cap{opacity:1}
.wi.empty{display:grid;place-items:center;border:1px dashed color-mix(in srgb,var(--c) 35%,var(--line));font:11px var(--mono);color:var(--mute)}
.wall-note{font-size:13px;color:var(--mute);margin-top:6px}
.prose h2 small{font:400 12px var(--mono);color:var(--mute);letter-spacing:0;margin-left:8px}
.back-wall{display:inline-flex;gap:6px;margin-top:40px;font:12.5px var(--mono);color:var(--ink-2);border-bottom:1px solid var(--c)}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="목차">
    <div class="side-in">
      <div class="who"><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b>장효준</b></div>
      <button class="new" data-go="home"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>처음으로</button>
      <p class="label">기록</p>
      <ul class="nav">
        <li><button data-go="dev"><i class="sw" style="background:var(--dev)"></i>개발 기록<small>12</small></button></li>
        <li><button data-go="work"><i class="sw" style="background:var(--work)"></i>포트폴리오<small>5</small></button></li>
        <li><button data-go="photo"><i class="sw" style="background:var(--photo)"></i>사진<small>3</small></button></li>
        <li><button data-go="book"><i class="sw" style="background:var(--book)"></i>독후감<small>5</small></button></li>
      </ul>
      <div class="side-foot"><span>rl2aderjoon</span><button class="chip" id="theme">밤</button></div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <button class="chip menu" id="menu">목차</button>
      <button class="chip" id="replay">처음부터 다시</button>
      <button class="chip" id="skip">건너뛰기</button>
    </div>

    <section class="hello" aria-live="polite">
      <h1><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="greet">안녕하세요</span></h1>
      <div class="composer" id="c0">
        <textarea id="t0" rows="1" aria-label="질문" placeholder="장효준에 대해 무엇이든 물어보세요" readonly></textarea>
        <div class="crow"><span class="tool" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></span><span class="crow-r"><span class="model"><b>장효준 2026</b><small>포트폴리오</small><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="m2.5 4 2.5 2.5L7.5 4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg></span><button class="send" id="s0" aria-label="보내기"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></span></div>
      </div>
      <div class="sugg" aria-label="바로 가기">
        <button data-go="dev" style="--c:var(--dev)"><i></i>개발 기록</button>
        <button data-go="work" style="--c:var(--work)"><i></i>포트폴리오</button>
        <button data-go="photo" style="--c:var(--photo)"><i></i>사진</button>
        <button data-go="book" style="--c:var(--book)"><i></i>독후감</button>
      </div>
      <p class="fine">장효준도 실수를 합니다. 그래서 기록을 남깁니다.</p>
    </section>

    <div class="thread" id="thread"><div class="col" id="col"></div></div>

    <div class="dock">
      <div class="composer">
        <textarea id="t1" rows="1" placeholder="보고 싶은 걸 말해 주세요 — 예: 사진 보여줘" aria-label="질문"></textarea>
        <div class="crow"><span class="hint">Enter로 보내기</span><button class="send" id="s1" aria-label="보내기"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      </div>
    </div>
  </main>

  <article class="doc" id="doc" aria-label="상세" hidden>
    <div class="doc-bar">
      <i class="sw"></i><span class="crumb" id="crumb"></span>
      <span class="gap"></span>
      <button class="wide-btn" id="dwide">넓게 읽기</button>
      <button class="ib" id="dprev" aria-label="이전"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 4 7l5 5" stroke="currentColor" stroke-width="1.7" fill="none"/></svg></button>
      <button class="ib" id="dnext" aria-label="다음"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m5 2 5 5-5 5" stroke="currentColor" stroke-width="1.7" fill="none"/></svg></button>
      <button class="ib" id="dclose" aria-label="닫기"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="m3 3 8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.7" fill="none"/></svg></button>
    </div>
    <div class="doc-body" id="docbody"><div class="doc-in" id="docin"></div></div>
  </article>
</div>

<template id="tpl-home">
  <div class="intro reveal">
    <p class="hi" data-stream>안녕하세요, 장효준입니다.</p>
    <h2 data-stream>코드를 읽는 시대는 끝났다고 생각합니다. 무엇을 왜 만들지 정하고, AI와 함께 끝까지 완성합니다.</h2>
    <p class="lede" data-stream>여행 앱의 추천 서버에서 순찰 로봇의 펌웨어까지, 올해는 분야를 가리지 않았습니다. 대신 순서는 늘 같았습니다. 먼저 재고, 숫자가 가리키는 곳을 고치고, 닿지 못한 결과도 남깁니다.</p>
    <dl class="stats">
      <div><dt>24,000+</dt><dd>npm 누적 다운로드<br>axmap-cli</dd></div>
      <div><dt>3,562</dt><dd>팀 저장소에서 쓰인<br>axMap 선점</dd></div>
      <div><dt>350억+</dt><dd>최근 3개월<br>AI 토큰 사용량</dd></div>
      <div><dt>1등 · 2등</dt><dd>SSAFY 공통 · 특화<br>프로젝트</dd></div>
    </dl>
    <div class="four">
      <button data-go="dev" style="--c:var(--dev)"><span class="sw"></span><b>개발 기록</b><span>문제와 선택, 검증을 남긴 글</span><em>최근<b>여러 에이전트가 같은 저장소를 잡을 때</b></em></button>
      <button data-go="work" style="--c:var(--work)"><span class="sw"></span><b>포트폴리오</b><span>가볼래, 삐용, axMap 외</span><em>대표<b>가볼래 · 특화 2등</b></em></button>
      <button data-go="photo" style="--c:var(--photo)"><span class="sw"></span><b>사진</b><span>직접 찍은 장면들</span><em>최근<b>광안대교</b></em></button>
      <button data-go="book" style="--c:var(--book)"><span class="sw"></span><b>독후감</b><span>읽고 남긴 생각</span><em>최근<b>오브젝트</b></em></button>
    </div>
    <p class="links"><a href="https://github.com/rl2aderjoon">GitHub</a><a href="2026/">2026 포트폴리오</a></p>
  </div>
</template>

<script>
const $=s=>document.querySelector(s), body=document.body, col=$('#col'), thread=$('#thread');
const ASK={home:'장효준의 블로그를 보여줘',dev:'개발 기록 보여줘',work:'포트폴리오 보여줘',photo:'사진 보여줘',book:'독후감 보여줘'};
const SAY={home:'',dev:'최근 글부터 정리했어요.',work:'다섯 개 작업을 큰 화면으로 펼쳤어요.',photo:'직접 찍은 사진이에요. 모두 보기를 누르면 날짜순 벽으로 펼쳐요.',book:'읽고 남긴 글이에요.'};
const FOLLOW={home:[],dev:['포트폴리오','독후감'],work:['개발 기록','사진'],photo:['포트폴리오','처음으로'],book:['개발 기록','사진']};
const KEY={'개발 기록':'dev','포트폴리오':'work','사진':'photo','독후감':'book','처음으로':'home'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let run=0; const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));

async function type(el,text,id){
  el.value='';
  for(const ch of text){ if(id!==run) return; el.value+=ch; await wait(70+Math.random()*60); }
}
async function press(btn){ btn.classList.add('press'); await wait(160); btn.classList.remove('press'); }

function reveal(node){
  [...node.children].forEach((c,i)=>setTimeout(()=>c.classList.add('on'),reduce?0:120*i));
  node.querySelectorAll('.four>button,.lead,.rows li').forEach((c,i)=>{
    c.style.cssText+=';opacity:0;transform:translateY(10px);transition:opacity .45s,transform .55s var(--ease)';
    setTimeout(()=>{c.style.opacity=1;c.style.transform='none'},reduce?0:260+90*i);
  });
}

const navIn=on=>document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('in',on));
async function findSteps(a,id){
  const s=document.createElement('div'); s.className='steps';
  s.innerHTML='<p class="st-h"><span class="spin"></span><span>기록을 찾는 중</span></p><ul></ul>'; a.append(s);
  const ul=s.querySelector('ul');
  for(const b of document.querySelectorAll('.nav button')){
    await wait(420); if(id!==run) return false;
    const li=document.createElement('li');
    li.innerHTML=`<i style="background:${b.querySelector('.sw').style.background}"></i>${b.childNodes[1].textContent}<small>${b.querySelector('small').textContent}</small>`;
    ul.append(li); b.classList.add('in');
  }
  await wait(450); if(id!==run) return false;
  s.querySelector('.st-h').innerHTML=' 기록 네 갈래를 찾았어요'; s.classList.add('done');
  return true;
}
async function stream(box,id){
  for(const el of box.querySelectorAll('[data-stream]')){
    const words=el.textContent.trim().split(/\s+/); el.textContent=''; el.classList.add('on','cursor');
    for(const w of words){ if(id!==run) return; el.textContent+=(el.textContent?' ':'')+w; await wait(el.tagName==='H2'?70:32); }
    el.classList.remove('cursor');
  }
}
async function answer(key,id,steps=false){
  const u=document.createElement('div'); u.className='msg-u'; u.textContent=ASK[key]; col.append(u);
  const a=document.createElement('div'); a.className='msg-a';
  a.innerHTML='<div class="think"><i></i><i></i><i></i><i></i></div>'; col.append(a);
  thread.scrollTop=thread.scrollHeight;
  await wait(key==='home'?900:600); if(id!==run) return;
  a.innerHTML='';
  if(steps){ if(!await findSteps(a,id)) return; } else navIn(true);
  if(SAY[key]){const p=document.createElement('p');p.style.cssText='color:var(--ink-2);margin-bottom:16px';a.append(p);
    for(const ch of SAY[key]){ if(id!==run) return; p.textContent+=ch; await wait(18);} }
  const frag=$('#tpl-'+key).content.cloneNode(true); const box=frag.firstElementChild; a.append(box);
  if(key==='home'){ await stream(box,id); if(id!==run) return; }
  reveal(box);
  if(FOLLOW[key].length){const f=document.createElement('div');f.className='follow';f.style.marginTop='18px';
    f.innerHTML=FOLLOW[key].map(t=>`<button data-go="${KEY[t]}">${t}도 볼래요</button>`).join('');a.append(f);}
  document.querySelectorAll('.nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.go===key));
  thread.scrollTo({top:u.getBoundingClientRect().top-thread.getBoundingClientRect().top+thread.scrollTop-64});
}

async function go(key){
  const id=++run; body.classList.remove('drawer');
  if(!body.classList.contains('started')){ body.classList.add('started','open'); col.innerHTML=''; return answer(key,id); }
  const t=$('#t1'); await type(t,ASK[key],id); if(id!==run) return;
  await press($('#s1')); t.value=''; await answer(key,id);
}

async function intro(){
  const id=++run;
  body.classList.remove('started','open','reading','wide'); col.innerHTML=''; $('#t0').value=''; navIn(false);
  await wait(900); await type($('#t0'),ASK.home,id); if(id!==run) return;
  await wait(350); await press($('#s0')); if(id!==run) return;
  body.classList.add('started'); await wait(350); body.classList.add('open');
  await answer('home',id,true);
}

function skip(){
  run++; body.classList.add('started','open'); col.innerHTML='';
  answer('home',run);
}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(!g) return;
  if(g.dataset.go==='home'){ const id=++run; col.innerHTML=''; answer('home',id); }
  else go(g.dataset.go);
});

/* 효과: 상세 본문 안 .fx가 보이면 켜고, 벗어나면 영상과 그림을 멈춘다 */
let fxObs=null, axTimer=null;
function countUp(el){
  const raw=el.dataset.to, m=raw.match(/[\d,.]+/); if(!m||reduce) return;
  const tgt=parseFloat(m[0].replace(/,/g,'')), dec=(m[0].split('.')[1]||'').length, comma=m[0].includes(','), t0=performance.now();
  const f=v=>{let s=v.toFixed(dec); if(comma) s=Number(s).toLocaleString('en-US',{minimumFractionDigits:dec}); return raw.replace(m[0],s);};
  (function tick(t){const k=Math.min(1,(t-t0)/1100), e=1-Math.pow(1-k,3); el.textContent=f(tgt*e); if(k<1) requestAnimationFrame(tick); else el.textContent=raw;})(t0);
}
const AX=[
  ['cl','led','docs/** · Claude Code','선점: docs/**'],
  ['cx','led','server/** · Codex','선점: server/**'],
  ['ag','no','server/api.ts · agy','거절: server/**와 겹침'],
  ['ag','q','agy','쪽지 → Codex: 응답 형식 바꿔도 돼?'],
  ['cl','q','Claude','쪽지 → Codex: 문서에 엔드포인트 추가'],
  ['cx','turn','','작업 경계: 쪽지 2개를 한 번에 회수'],
  ['cx','gone','server/**','반납: server/**'],
  ['ag','led','server/api.ts · agy','선점: server/api.ts'],
];
function runAx(root){
  clearInterval(axTimer); let i=0, turn=0;
  const led=root.querySelector('.led'), q=root.querySelector('.q'), log=root.querySelector('.log'), tb=root.querySelector('.turn b');
  const reset=()=>{led.innerHTML='';q.innerHTML='';tb.textContent='0';turn=0;};
  reset();
  const step=()=>{
    if(i===AX.length){ i=0; reset(); log.textContent='› 처음부터'; return; }
    const [k,type,txt,msg]=AX[i++], kc=root.querySelector(`[data-k="${k}"]`).style.getPropertyValue('--k');
    root.querySelectorAll('.ag div').forEach(d=>d.classList.toggle('hot',d.dataset.k===k));
    if(type==='led'||type==='no'){ const li=document.createElement('li'); li.style.setProperty('--k',kc); if(type==='no') li.className='no';
      li.innerHTML=`<i>${type==='no'?'✕':'■'}</i>${txt}`; led.append(li); while(led.children.length>4) led.firstChild.remove(); }
    if(type==='q'){ const s=document.createElement('span'); s.style.setProperty('--k',kc); s.textContent=txt; q.append(s); }
    if(type==='turn'){ q.innerHTML=''; tb.textContent=String(++turn); }
    if(type==='gone'){ [...led.children].filter(li=>li.textContent.includes(txt)&&!li.classList.contains('no')).forEach(li=>li.classList.add('gone')); }
    log.textContent='› '+msg;
  };
  step(); axTimer=setInterval(step,1300);
}
function setupFx(){
  fxObs?.disconnect(); clearInterval(axTimer);
  const rootEl=$('#docbody');
  fxObs=new IntersectionObserver(es=>es.forEach(e=>{
    const el=e.target;
    if(el.matches('video')){ e.isIntersecting?el.play().catch(()=>{}):el.pause(); return; }
    if(e.isIntersecting&&!el.classList.contains('in')){ el.classList.add('in'); el.querySelectorAll('[data-to]').forEach(countUp); }
    if(el.hasAttribute('data-axd')){ e.isIntersecting?runAx(el):clearInterval(axTimer); }
  }),{root:rootEl,threshold:.35});
  $('#docin').querySelectorAll('.fx,video').forEach(el=>fxObs.observe(el));
  // 넘겨보기: 가운데 화면 표시, 끌어서 넘기기
  $('#docin').querySelectorAll('.strip').forEach(st=>{
    const items=[...st.children], lab=st.parentElement.querySelector('.strip-nav b');
    const mark=()=>{const c=st.scrollLeft+st.clientWidth/2; let best=0,bd=1e9;
      items.forEach((f,k)=>{const d=Math.abs(f.offsetLeft+f.offsetWidth/2-c); if(d<bd){bd=d;best=k;}});
      items.forEach((f,k)=>f.classList.toggle('cur',k===best)); lab.textContent=`${best+1} / ${items.length}`; st.dataset.i=best;};
    st.addEventListener('scroll',mark,{passive:true}); setTimeout(mark,50);
    let down=null; st.onpointerdown=e=>{down={x:e.clientX,s:st.scrollLeft}; st.style.scrollSnapType='none'; st.setPointerCapture(e.pointerId);};
    st.onpointermove=e=>{ if(down) st.scrollLeft=down.s-(e.clientX-down.x); };
    st.onpointerup=()=>{ down=null; st.style.scrollSnapType=''; };
    st.parentElement.querySelectorAll('[data-strip]').forEach(b=>b.onclick=()=>{
      const n=Math.max(0,Math.min(items.length-1,(+st.dataset.i||0)+(+b.dataset.strip)));
      st.scrollTo({left:items[n].offsetLeft-(st.clientWidth-items[n].offsetWidth)/2,behavior:'smooth'});});
  });
}

// 한 줄씩 채운다: 목표 높이로 늘어놓다가 줄이 넘치면 그 줄의 높이를 줄여 폭에 딱 맞춘다
function layoutWall(el){
  const items=WALL.find(w=>w[0]===el.dataset.wall)[1], W=el.clientWidth, gap=6, target=W<520?120:190;
  if(!W) return;
  const rows=[]; let row=[], sum=0;
  items.forEach(it=>{ row.push(it); sum+=it[0];
    if(sum*target+gap*(row.length-1)>=W){ rows.push([row,(W-gap*(row.length-1))/sum]); row=[]; sum=0; } });
  if(row.length){
    // 남은 줄이 폭의 절반도 못 채우면 윗줄에 합쳐, 한 장만 덩그러니 남지 않게 한다
    if(rows.length&&sum*target+gap*(row.length-1)<W*.5){ const prev=rows.pop()[0].concat(row), s=prev.reduce((t,x)=>t+x[0],0); rows.push([prev,(W-gap*(prev.length-1))/s]); }
    else rows.push([row,Math.min(target,(W-gap*(row.length-1))/sum)]);
  }
  el.innerHTML=rows.map(([r,h])=>r.map(([ar,id])=>{
    const w=Math.floor(ar*h), st=`width:${w}px;height:${Math.round(h)}px`;
    if(!id) return `<span class="wi empty" style="${st}">${ratioName(ar)}</span>`;
    const src=PHOTOS.find(p=>p[0]===id)[1];
    return `<button class="wi" style="${st}" data-open="${id}" aria-label="${DOCS[id].title} 크게 보기"><img src="${src}" alt="" loading="lazy"><span class="cap">${DOCS[id].title} · ${el.dataset.wall}</span></button>`;
  }).join('')).join('');
  [...el.children].forEach((c,k)=>c.style.transitionDelay=(reduce?0:k*45)+'ms');
}
